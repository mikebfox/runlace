[build-system]
requires = []
build-backend = "runlace_build"
backend-path = ["build_backend"]

[project]
name = "runlace"
version = "0.1.0"
description = "Local-first summaries and safety checks for AI agent JSONL traces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mikebfox" }]
keywords = [
  "ai-agents",
  "observability",
  "opentelemetry",
  "jsonl",
  "llmops",
  "devtools",
  "privacy"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring"
]
dependencies = []

[project.scripts]
runlace = "runlace.cli:main"

[project.urls]
Homepage = "https://github.com/mikebfox/runlace"
Repository = "https://github.com/mikebfox/runlace"
Issues = "https://github.com/mikebfox/runlace/issues"
